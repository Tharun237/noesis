<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Noesis: the app, in under a minute</title>
    <!-- The frame around the app-tour film (film/tour.mjs): a real recording of the real app on a phone-sized
         screen, with one line of words for each thing it does. This page draws one frame when asked
         (window.draw), tour.mjs photographs it. Two shapes: tall (1080x1920, ?wide absent) and wide (1920x1080). -->
    <style>
      @font-face { font-family: 'DM Sans'; src: url('/node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2') format('woff2'); font-weight: 100 1000; }
      @font-face { font-family: 'JetBrains Mono'; src: url('/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 800; }
      html, body { margin: 0; background: #000; }
      #stage { position: relative; overflow: hidden; background: #000; color: #fff; font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
      .tall { width: 1080px; height: 1920px; }
      .wide { width: 1920px; height: 1080px; }
      #words { position: absolute; }
      .tall #words { left: 70px; right: 70px; top: 86px; height: 300px; display: flex; flex-direction: column; justify-content: center; }
      .wide #words { left: 150px; width: 900px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
      #step { font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.24em; color: #AAFF00; }
      .tall #step { font-size: 24px; margin-bottom: 20px; }
      .wide #step { font-size: 26px; margin-bottom: 28px; }
      #head { font-weight: 800; letter-spacing: -0.045em; line-height: 1.02; }
      .tall #head { font-size: 76px; }
      .wide #head { font-size: 104px; }
      #sub { color: rgba(255, 255, 255, 0.6); line-height: 1.3; }
      .tall #sub { font-size: 34px; margin-top: 18px; }
      .wide #sub { font-size: 40px; margin-top: 28px; }
      #phone { position: absolute; overflow: hidden; background: #000; border: 2px solid rgba(255, 255, 255, 0.16); box-shadow: 0 0 0 10px #0b0b0b, 0 0 0 12px rgba(255, 255, 255, 0.08), 0 40px 140px rgba(170, 255, 0, 0.07); }
      .tall #phone { left: 195px; top: 410px; width: 690px; height: 1493px; border-radius: 56px; }
      .wide #phone { left: 1250px; top: 40px; width: 462px; height: 1000px; border-radius: 44px; }
      #phone img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #card { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 90px; }
      #card .line { font-weight: 800; letter-spacing: -0.045em; line-height: 1.04; }
      .tall #card .line { font-size: 92px; margin-top: 70px; }
      .wide #card .line { font-size: 112px; margin-top: 60px; }
      #card .under { color: rgba(255, 255, 255, 0.6); line-height: 1.35; }
      .tall #card .under { font-size: 38px; margin-top: 30px; }
      .wide #card .under { font-size: 42px; margin-top: 30px; }
      #card .where { font-family: 'JetBrains Mono', monospace; letter-spacing: 0.08em; color: #AAFF00; }
      .tall #card .where { font-size: 40px; margin-top: 90px; }
      .wide #card .where { font-size: 44px; margin-top: 70px; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="words"><div id="step"></div><div id="head"></div><div id="sub"></div></div>
      <div id="phone"><img id="shot" alt="" /></div>
      <div id="card"><div id="mark"></div><div class="line" id="line"></div><div class="under" id="under"></div><div class="where" id="where"></div></div>
    </div>
    <script type="module">
      import { WORDMARK } from '/src/ui/brand-paths.js'
      const wide = new URLSearchParams(location.search).has('wide')
      const $ = id => document.getElementById(id)
      $('stage').className = wide ? 'wide' : 'tall'
      $('mark').innerHTML = `<svg width="${wide ? 560 : 520}" viewBox="0 0 ${WORDMARK.w} ${WORDMARK.h}"><path fill-rule="evenodd" fill="#fff" d="${WORDMARK.d}"/></svg>`
      const out = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 4) // arrives fast, settles long
      let shown = null
      // One frame. `age` is seconds into this part, `left` seconds until it ends: words and picture arrive and go.
      //   { card: null | { line, under, where }, step, head, sub, img (a data URL, or null to keep the last one), age, left }
      window.draw = async f => {
        const arrive = out(f.age / 0.45), go = out(1 - f.left / 0.25)
        const seen = Math.max(0, arrive - (f.left < 0.25 ? go : 0))
        if (f.card) {
          $('card').style.display = 'flex'; $('words').style.display = 'none'; $('phone').style.display = 'none'
          $('line').textContent = f.card.line; $('under').textContent = f.card.under || ''; $('where').textContent = f.card.where || ''
          $('card').style.opacity = seen
          $('card').style.transform = `translateY(${(1 - arrive) * 26}px)`
          return
        }
        $('card').style.display = 'none'; $('words').style.display = 'flex'; $('phone').style.display = 'block'
        $('step').textContent = f.step || ''; $('head').textContent = f.head; $('sub').textContent = f.sub || ''
        $('words').style.opacity = seen
        $('words').style.transform = `translateY(${(1 - arrive) * 22}px)`
        $('phone').style.opacity = f.first ? arrive : 1
        if (f.img && f.img !== shown) { shown = f.img; $('shot').src = f.img; await $('shot').decode().catch(() => {}) }
      }
      await document.fonts.load("800 76px 'DM Sans'"); await document.fonts.load("400 24px 'JetBrains Mono'")
      window.READY = true
    </script>
  </body>
</html>
